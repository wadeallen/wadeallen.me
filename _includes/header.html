<!-- begin header -->
<header class="header">
  <div class="container-big">
    <div class="row">
      <div class="header__inner col col-12">

        <div class="logo">
          <a class="logo__link" href="{{ site.baseurl }}/">
            {% if site.data.settings.logo %}
            <img class="logo__image" src="{{ site.baseurl }}{{ site.data.settings.logo }}" alt="{{ site.data.settings.title }}">
            {% else %}
            {{ site.data.settings.title }}
            {% endif %}
          </a>
        </div>

        <nav class="main-nav" id="js-navbar">
          <div class="main-nav__box">
            <ul class="nav__list list-reset">
              {% for item in site.data.settings.menu_settings.menu_items %}
              <li class="nav__item">
                <a href="{{ item.url | relative_url }}" class="nav__link{% if item.url == page.url %} active-link{% endif %}">{{ item.title }}</a>
              </li>
              {% endfor %}
            </ul>
          </div>
        </nav>

        <div class="hamburger">
          <div></div>
        </div>

      </div>
    </div>
  </div>
</header>
<!-- end header -->
